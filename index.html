<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f6f0" />
    <script>
      (function () {
        try {
          var platform =
            (navigator.userAgentData && navigator.userAgentData.platform) ||
            navigator.platform ||
            "";
          var isMacOS =
            /mac/i.test(platform) &&
            !(navigator.maxTouchPoints && navigator.maxTouchPoints > 1);

          if (isMacOS) {
            document.documentElement.setAttribute("data-scrollbar", "native");
          }

          var savedScheme = localStorage.getItem("scheme");
          var hasSavedScheme =
            savedScheme === "light" || savedScheme === "dark";
          var prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;

          if (savedScheme === "dark" || (!hasSavedScheme && prefersDark)) {
            document.documentElement.setAttribute("data-theme", "dark");
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute("content", "#121212");
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html {
        background-color: #f8f6f0;
      }
      html[data-theme="dark"] {
        background-color: #121212;
      }
    </style>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon-48x48.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/reset.css" />
    <link rel="stylesheet" href="/fonts.css" />
    <meta
      name="description"
      content="Showcasing my work and providing contact details for inquiries."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Digital Resume" />
    <meta
      property="og:description"
      content="Showcasing my work and providing contact details for inquiries."
    />
    <meta name="twitter:card" content="summary" />
    <title>Digital Resume</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="overlay"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
